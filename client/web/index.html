<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Without this, mobile browsers use a virtual ~980px "layout viewport" and
     scale the page down to fit -- window.innerWidth (what Fyne's wasm driver
     sizes its canvas from) then reports 980 instead of the phone's real
     width, so every IsMobile()/canvas-width-driven responsive branch in the
     app never sees a narrow screen and the whole UI renders desktop-wide.
     width=device-width + initial-scale=1 makes the layout viewport match the
     real device width, same as Fyne's own cmd/fyne packaging does. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>USBridge Client (web)</title>
<style>
  /* 100dvh (dynamic viewport height) instead of a fixed 100vh/100%: on
     mobile Chrome, 100vh is pinned to the *largest* possible viewport (bar
     hidden), so a page that's exactly 100vh tall never needs to scroll and
     Chrome never gets a reason to auto-hide its address bar while browsing
     this app -- confirmed live. 100dvh instead tracks whatever the *current*
     visual viewport actually is, shrinking/growing live as the address bar
     shows/hides, so the canvas continuously fills whatever space Chrome is
     currently giving the page. Falls back to 100vh on older browsers/engines
     that don't support dvh (the @supports block below is skipped there,
     leaving the plain 100vh rule as-is).
  */
  html, body { margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; background: #000; }
  @supports (height: 100dvh) {
    html, body { height: 100dvh; }
  }
  canvas { display: block; }
  /* No fixed position: this button is docked to the "HID & Input Hub"
     card's own header, wherever Fyne currently renders it (see
     internal/gui/controller/disk_widget_hid_connect_wasm.go's
     syncHIDConnectOverlay, which drives usbridgeSetHIDButtonRect below).
     Fully transparent -- the Fyne-drawn DeviceDashboardHeaderButton
     underneath supplies the visible label in the app's own style; this
     element exists purely to be a real DOM click target sitting exactly on
     top of it (see that same file's doc comment for why the click itself
     cannot originate from Go). display:none until the first rect arrives,
     so it can't flash at the CSS default (0,0) position beforehand. */
  #hidConnectBtn {
    position: fixed;
    z-index: 1000;
    display: none;
    padding: 0;
    margin: 0;
    border: none;
    background: transparent;
    cursor: pointer;
  }
  /* Positioned every 150ms tick by video_widget_ai_vision_wasm.go's
     syncAIVisionOverlay to exactly cover the <video> element's own content
     rect (see that function's doc comment) -- pixel content (the actual
     detection boxes) comes separately from
     internal/service/ai_vision_wasm.go's pushAIVisionOverlayToCanvas via
     putImageData. pointer-events:none so it never intercepts touch/mouse
     input meant for the video underneath; hidden until the first real
     content rect arrives, same as #hidConnectBtn above. */
  #aiVisionCanvas {
    position: fixed;
    z-index: 900;
    visibility: hidden;
    pointer-events: none;
  }
</style>
</head>
<body>
<!-- Grants WebHID access to a gamepad or pen tablet -- the primary capture
     path in Chrome/Edge (see internal/platform/gamepad_hid_wasm.go's doc
     comment for why: it gives real vendor/product id and the real HID
     report descriptor, which is what lets that code use the same
     SDL_GameControllerDB mapping the native Windows/Linux client already
     uses instead of Chrome's own -- sometimes incomplete -- Gamepad API
     mapping; and what lets pen_capture_wasm.go export a real Wacom tablet
     at all, see wacom_model.go). Deliberately a plain HTML button, not a
     Fyne canvas control: navigator.hid.requestDevice() is user-gesture-gated
     and reliably fails when called from inside a Go js.FuncOf callback (see
     installFullscreenOnFirstTap/installClipboardPasteBridge below for two
     other browser APIs that showed the exact same failure live) -- this
     stays outside Go entirely for that one call. Hidden by installHIDButton
     below on browsers with no WebHID (Firefox, Safari), where the Gamepad
     API poller is the only option anyway. -->
<button id="hidConnectBtn" aria-label="Connect USB"></button>
<!-- AI Vision's live overlay canvas -- see the #aiVisionCanvas style rule
     above and internal/service/ai_vision_wasm.go/
     internal/gui/controller/video_widget_ai_vision_wasm.go for how it's
     driven. Empty/transparent until AI Vision is actually turned on. -->
<canvas id="aiVisionCanvas"></canvas>
<!-- Fyne's wasm/js driver looks up #dummyEntry by ID (see
     internal/driver/glfw/device_wasm.go) and uses it as a real, native
     <input> element to host IME composition, on-screen-keyboard triggering,
     and OS clipboard paste for every Fyne text Entry widget -- none of
     which work on a canvas-rendered "fake" text field without a genuine
     native input backing it. Omitting this element (as our earlier minimal
     test page did) is exactly why long-press-to-paste silently did nothing
     on Android: there was no real input for the OS paste gesture to target.
     Position/size copied from Fyne's own cmd/fyne packaging template. -->
<!-- autocomplete/name/type below discourage (not guarantee -- this is a
     Chrome/Gboard heuristic, not something a page can force off) the
     password/card/address autofill suggestion strip Gboard shows above
     its own keyboard: Chrome's heuristics key heavily off autocomplete
     values and field names that look like login/payment fields, so an
     explicit "off" plus a name that doesn't resemble "password"/"card"
     steers away from that classification for what's really just a plain
     text-relay input. -->
<input id="dummyEntry" type="text" name="usbridge-remote-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="position: absolute; left: 0; top: -100pt; z-index: -10; font-size: 32pt;" />
<script src="runtime-config.js"></script>
<script src="runtime-policy.js"></script>
<script src="wasm_exec.js"></script>
<!-- Defines window.usbridgeAIVision only -- no fetch happens just from
     loading this module (see ai_vision.js's own top doc comment): the
     model/WebGPU runtime are only fetched once Go actually calls
     loadModel(), the moment the AI Vision checkbox or "Local models"
     toggle is turned on this session. -->
<script type="module" src="ai_vision.js"></script>
<script src="bootstrap.js"></script>
</body>
</html>
