; USBridge dongle: a hardware USB/IP importer ("VHCI in a stick").
; The native USB port is the gadget towards the agent machine: a CDC-NCM
; network link plus, while attached, the cloned USB device.
[platformio]
default_envs = esp32s3

[env]
platform = espressif32@6.13.0
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ESP32-S3 "mini"/SuperMini class boards (ESP32-S3FH4R2: 4MB flash, one
; USB-C wired straight to the native USB pins, no UART bridge).
[env:esp32s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; Flashing goes through the ROM's USB-Serial-JTAG (hold BOOT while plugging
; in, or send BOOTLOADER to the control port); only a watchdog reset gets the
; chip out of that mode and into the new firmware.
board_upload.after_reset = watchdog_reset
