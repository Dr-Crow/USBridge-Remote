version: 2.1
jobs:
  windows-preview-eligibility:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    steps:
      - checkout
      - run:
          name: Observe current Windows process eligibility without changing identity
          command: .\.circleci\test-windows-preview-eligibility.ps1
          no_output_timeout: 5m
      - store_artifacts:
          path: artifacts/windows-preview-eligibility
          destination: windows-preview-eligibility
workflows:
  read-only-eligibility:
    jobs:
      - windows-preview-eligibility
