version: 2.1

# Isolated signature-owner prerequisite branch. No agent, viewer, broker,
# acquired media, release build or source/binary artifact publication.
jobs:
  windows-signature-owner:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    steps:
      - checkout
      - run:
          name: Verify extracted signature-only owner on native Windows
          command: .\.circleci\test-signature-owner.ps1
          no_output_timeout: 10m
      - store_artifacts:
          path: signature-owner-evidence
          destination: signature-owner-evidence

workflows:
  signature-owner-prerequisite:
    jobs:
      - windows-signature-owner:
          filters:
            branches:
              only: windows-signature-owner-tests
