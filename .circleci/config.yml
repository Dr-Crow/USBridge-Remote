version: 2.1
jobs:
  windows-manager-staging:
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -NoProfile -ExecutionPolicy Bypass
    resource_class: windows.medium
    steps:
      - checkout
      - run:
          name: Install the existing verified user-mode toolchain
          command: .\.circleci\setup-windows.ps1
          no_output_timeout: 15m
      - run:
          name: Diagnose unchanged synthetic Manager staging predicates
          command: |
            $ErrorActionPreference = 'Stop'
            $env:CHERE_INVOKING = 'yes'
            $env:MSYSTEM = 'UCRT64'
            $env:USBRIDGE_CI_ROOT = (Get-Location).Path
            New-Item -ItemType Directory -Force 'artifacts\windows-manager-staging' | Out-Null
            & 'C:\ci\msys64\usr\bin\bash.exe' --login .circleci/test-windows-manager-staging.sh
            if ($LASTEXITCODE -ne 0) { throw 'Synthetic staging diagnostic failed' }
          no_output_timeout: 5m
      - store_artifacts:
          path: artifacts/windows-manager-staging
          destination: windows-manager-staging
workflows:
  native-manager-staging:
    jobs:
      - windows-manager-staging
